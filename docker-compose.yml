services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    build: ./Backend
    container_name: backend
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Dapp.jwt.secret=TestSecretKeyTestSecretKeyTestSecretKey123456
        -Dapp.jwt.access-expiration=3600000
        -Dapp.jwt.refresh-expiration=604800000
        -Dspring.datasource.url=jdbc:sqlserver://sqlserver:1433;databaseName=appdb;encrypt=false;trustServerCertificate=true
        -Dspring.datasource.username=sa
        -Dspring.datasource.password=YourStrong!Passw0rd

  frontend:
    build: ./Frontend
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  sqlserver_data: